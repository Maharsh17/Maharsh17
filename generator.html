<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile README Generator · Maharsh17</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #0d1117; color: #c9d1d9; }
  .layout { display: grid; grid-template-columns: 420px 1fr; min-height: 100vh; }
  aside { padding: 24px; border-right: 1px solid #30363d; overflow-y: auto; max-height: 100vh; }
  main { padding: 24px; overflow-y: auto; max-height: 100vh; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #8b949e; margin-bottom: 24px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #8b949e; margin: 22px 0 8px; border-top: 1px solid #21262d; padding-top: 14px; }
  h2:first-of-type { border-top: none; padding-top: 0; }
  .row { display: grid; grid-template-columns: 120px 1fr; gap: 8px; margin: 6px 0; align-items: center; }
  label { font-size: 12px; color: #c9d1d9; }
  input { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 7px 9px; font: inherit; font-size: 13px; width: 100%; }
  input:focus { outline: none; border-color: #58a6ff; }
  input.overflow { border-color: #f85149; background: #2a1414; }
  button { background: #238636; color: white; border: none; padding: 10px 14px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; margin: 4px 4px 4px 0; font-weight: 500; }
  button:hover { background: #2ea043; }
  button.secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
  button.secondary:hover { background: #30363d; }
  .preview { background: #010409; padding: 16px; border-radius: 12px; display: inline-block; max-width: 100%; margin-bottom: 16px; }
  .preview svg { display: block; max-width: 100%; height: auto; }
  .preview-label { font-size: 12px; color: #8b949e; margin: 8px 0 6px; text-transform: uppercase; letter-spacing: 0.08em; }
  .warning { background: #4a1818; color: #ffa198; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin: 12px 0; border: 1px solid #6e2828; }
  .help { font-size: 11px; color: #6e7681; margin: 4px 0 8px; }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>Profile README Generator</h1>
    <div class="sub">Edit any field. Preview updates live. Download when ready, replace the SVGs in the repo, push.</div>

    <h2>Header & Captions</h2>
    <div class="row"><label>Caption 1</label><input id="caption1" value="Maharsh Jani"></div>

    <h2>Education</h2>
    <div data-section="education"></div>

    <h2>Skills</h2>
    <div data-section="skills"></div>

    <h2>Experience</h2>
    <div data-section="experience"></div>

    <h2>Export</h2>
    <div class="help">Replace <code>dark_mode.svg</code> and <code>light_mode.svg</code> in the repo root with the downloads.</div>
    <button onclick="download('dark')">Download dark_mode.svg</button>
    <button onclick="download('light')">Download light_mode.svg</button>
    <button class="secondary" onclick="copyToClipboard('dark')">Copy dark SVG</button>
    <button class="secondary" onclick="copyToClipboard('light')">Copy light SVG</button>
  </aside>

  <main>
    <div id="warnings"></div>
    <div class="preview-label">Dark</div>
    <div class="preview" id="wrap-dark"></div>
    <div class="preview-label">Light</div>
    <div class="preview" id="wrap-light" style="background:#fff"></div>
  </main>
</div>

// Beckett and BankGothic are proportional, so leader dots can no longer be
// counted as characters the way a monospace face allowed. They get measured.
const _mc = document.createElement('canvas').getContext('2d');
function textWidth(s, font) { _mc.font = font; return _mc.measureText(s).width; }
function inkWidth(s, font) {
  _mc.font = font;
  const m = _mc.measureText(s);
  return Math.max(m.width, m.actualBoundingBoxRight || 0);
}
const HEAD_FONT = "24px Beckett";
const ROW_FONT = "bold 15px BankGothic";

function loadFonts() {
  const css = `@font-face{font-family:'Beckett';src:url(data:font/woff2;base64,${BECKETT}) format('woff2')}`
            + `@font-face{font-family:'BankGothic';font-weight:bold;src:url(data:font/woff2;base64,${BANKGOTHIC}) format('woff2')}`;
  const el = document.createElement('style');
  el.textContent = css;
  document.head.appendChild(el);
  return Promise.all([document.fonts.load(ROW_FONT), document.fonts.load(HEAD_FONT),
                      document.fonts.load("34px Beckett")]);
}

function star(cx, cy, r) {
  const p = [];
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * 0.42 : r;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    p.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1));
  }
  return p.join(' ');
}

function escapeXML(s) {
  return s.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
}
function escapeAttr(s) {
  return escapeXML(s).replaceAll('"', '&quot;');
}

function buildRow(key, value, y, t) {
  const kw = textWidth(key + ':', ROW_FONT);
  const vw = textWidth(value, ROW_FONT);
  const x0 = 395, x1 = 940;
  const gapStart = x0 + kw + 10;
  const gapEnd = x1 - vw - 10;
  return {
    overflow: gapEnd - gapStart < 8,
    deficit: Math.ceil(gapStart - gapEnd + 8),
    markup:
      `<circle cx="${x0 - 12}" cy="${y - 5}" r="1.8" fill="${t.cc}"/>`
      + `<text class="bnk" x="${x0}" y="${y}" fill="${t.key}" font-size="15px">${escapeXML(key)}:</text>`
      + `<line x1="${Math.round(gapStart)}" y1="${y - 4}" x2="${Math.round(gapEnd)}" y2="${y - 4}" `
      + `stroke="${t.cc}" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 6"/>`
      + `<text class="bnk" x="${x1}" y="${y}" fill="${t.value}" font-size="15px" text-anchor="end">${escapeXML(value)}</text>`,
  };
}


function generate(themeName) {
  const t = THEMES[themeName];
  const overlays = [];
  const warnings = [];
  let y = 50;
  const dy = 20;

  y += 6;

  const order = ['education', 'skills', 'experience'];
  let isFirst = true;
  for (const k of order) {
    const title = config.sectionTitles[k];
    const rows = config.sections[k];
    if (title) {
      y += 24;
      const tw = inkWidth(title, HEAD_FONT);
      overlays.push(`<text class="bk" x="395" y="${y}" fill="${t.key}" font-size="24px">${escapeXML(title)}</text>`
        + `<line x1="${Math.round(395 + tw + 14)}" y1="${y - 7}" x2="940" y2="${y - 7}" stroke="${t.cc}" stroke-width="1"/>`);
      y += dy + 4;
    } else if (!isFirst) {
      // gap between sections (no visible dot, just space)
      y += dy;
    }
    isFirst = false;
    for (const r of rows) {
      const built = buildRow(r.key, r.value, y, t);
      if (built.overflow) warnings.push(`"${r.key}: ${r.value}" overflows by ${built.deficit}px`);
      overlays.push(built.markup);
      y += dy + 3;
    }
  }

  const STACK = 330 + 58 + 46;          // panel + name plate + wanted level
  const height = Math.max(STACK + 64, y + 28);
  const logoY = Math.round((height - STACK) / 2);
  const captionY1 = logoY + 330 + 54;
  const starsY = captionY1 + 36;
  // Wanted level, following what the game actually does. gta-reversed shows the
  // blink is gated on CWanted::m_LastTimeWantedLevelChanged, so it fires when the
  // level CHANGES rather than when you evade; the engine's idiom is a frame
  // counter bitmask (frameCounter & 4), which is a hard square wave, not a fade;
  // and the draw loop is `if (i < wantedLevel)`, so an unearned star is simply
  // not drawn. Only opacity animates. There is no red/blue anywhere in the HUD
  // palette's wanted display, only HUD_COLOUR_GOLD.
  const NSTAR = 6, SCYCLE = 9;
  const T_GAIN = 1.5, T_GAIN_END = 3.5;    // sixth star earned, 2s of blinking
  const T_LOSE = 5.5, T_LOSE_END = 7.5;    // and lost again, blinking once more
  const BLINK = 0.267;                     // 4 frames on, 4 off, at 30fps
  const EPS = 0.012;                       // collapses CSS interpolation to a step

  const stars = Array.from({ length: NSTAR }, (_, i) =>
    `<polygon class="st${i}" points="${star(190 - 70 + i * 28, starsY, 10)}"/>`).join('');

  const starCss = Array.from({ length: NSTAR }, (_, i) => {
    const sixth = i === NSTAR - 1;
    const segs = [[0, sixth ? 0 : 1]];
    for (let t = T_GAIN, k = 0; t < T_GAIN_END; t += BLINK / 2, k++) segs.push([t, k % 2 ? 0 : 1]);
    segs.push([T_GAIN_END, 1]);
    for (let t = T_LOSE, k = 0; t < T_LOSE_END; t += BLINK / 2, k++) segs.push([t, k % 2 ? 0 : 1]);
    segs.push([T_LOSE_END, sixth ? 0 : 1]);

    // Hold each value flat, then snap. Letting CSS interpolate between them
    // would fade the stars in and out instead of blinking them.
    const p = s => (s / SCYCLE * 100).toFixed(4);
    const f = [];
    segs.forEach(([t0, op], n) => {
      const t1 = n + 1 < segs.length ? segs[n + 1][0] : SCYCLE;
      f.push(`${p(t0)}%{opacity:${op}}`);
      if (t1 - EPS > t0 + 0.0005) f.push(`${p(t1 - EPS)}%{opacity:${op}}`);
    });
    f.push(`100%{opacity:${segs[segs.length - 1][1]}}`);

    return `@keyframes st${i}{${f.join('')}}`
         + `.st${i}{fill:${t.g2};animation:st${i} ${SCYCLE}s linear infinite;}`;
  }).join('');
  // Corner brackets, the way San Andreas frames a menu panel.
  const bx = 70, by = logoY, bw = 240, bh = 330, arm = 22;
  const corners = [[bx, by, 1, 1], [bx + bw, by, -1, 1],
                   [bx, by + bh, 1, -1], [bx + bw, by + bh, -1, -1]]
    .map(([x, y0, sx, sy]) =>
      `<path d="M ${x + sx * arm} ${y0} L ${x} ${y0} L ${x} ${y0 + sy * arm}" fill="none" `
      + `stroke="${t.g1}" stroke-width="3" stroke-linecap="square"/>`)
    .join('');

  const svg = `<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="ConsolasFallback,Consolas,monospace" width="985px" height="${height}px" font-size="15px">

${corners}
<text class="bk" x="190" y="${captionY1}" fill="url(#gg)" text-anchor="middle" font-size="44px">${escapeXML(config.caption1)}</text>
${stars}
${overlays.join('\n')}
</svg>`;

  return { svg, warnings };
}

function renderForm() {
  document.getElementById('caption1').value = config.caption1;
  for (const sec of Object.keys(config.sections)) {
    const container = document.querySelector(`[data-section="${sec}"]`);
    container.innerHTML = config.sections[sec].map((r, i) =>
      `<div class="row">
         <input type="text" value="${escapeAttr(r.key)}" data-sec="${sec}" data-idx="${i}" data-f="key" placeholder="Key">
         <input type="text" value="${escapeAttr(r.value)}" data-sec="${sec}" data-idx="${i}" data-f="value" placeholder="Value">
       </div>`
    ).join('');
  }
  document.querySelectorAll('input').forEach(el => el.addEventListener('input', onInput));
}

function onInput(e) {
  const el = e.target;
  if (el.id === 'caption1') config.caption1 = el.value;
  else if (el.dataset.sec) {
    config.sections[el.dataset.sec][+el.dataset.idx][el.dataset.f] = el.value;
  }
  render();
}

function render() {
  const dark = generate('dark');
  const light = generate('light');
  document.getElementById('wrap-dark').innerHTML = dark.svg.replace(/^<\?xml[^?]+\?>/, '');
  document.getElementById('wrap-light').innerHTML = light.svg.replace(/^<\?xml[^?]+\?>/, '');

  const all = [...new Set([...dark.warnings, ...light.warnings])];
  const w = document.getElementById('warnings');
  w.innerHTML = all.length
    ? all.map(s => `<div class="warning">⚠ ${s} — shorten the value or the key.</div>`).join('')
    : '';

  // mark overflowing inputs red
  document.querySelectorAll('input.overflow').forEach(el => el.classList.remove('overflow'));
  for (const sec of Object.keys(config.sections)) {
    config.sections[sec].forEach((r, i) => {
      const built = buildRow(r.key, r.value);
      if (built.overflow) {
        document.querySelector(`input[data-sec="${sec}"][data-idx="${i}"][data-f="value"]`)?.classList.add('overflow');
        document.querySelector(`input[data-sec="${sec}"][data-idx="${i}"][data-f="key"]`)?.classList.add('overflow');
      }
    });
  }
}

function download(themeName) {
  const { svg } = generate(themeName);
  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${themeName}_mode.svg`;
  a.click();
  URL.revokeObjectURL(url);
}

async function copyToClipboard(themeName) {
  const { svg } = generate(themeName);
  await navigator.clipboard.writeText(svg);
  alert(`${themeName}_mode.svg copied to clipboard`);
}

renderForm();
render();
</script>
</body>
</html>
